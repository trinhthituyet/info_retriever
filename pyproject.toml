[project]
name = "info-retriever"
version = "0.1.0"
description = "Agentic RAG over personal contract documents (rental, employment, insurance)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
info-retriever = "info_retriever.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_retriever"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
