[project]
name = "info-retriever"
version = "0.1.0"
description = "Agentic RAG over personal contract documents (rental, employment, insurance)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
#    "apple-certifi>=3.0.2",
    "openai>=1.40",
    "langgraph>=1.0",
]

[project.optional-dependencies]
# Rasterising scanned PDFs for a vLLM-served model. Not needed with
# LLM_PROVIDER=anthropic, which reads PDFs natively.
vllm = ["pymupdf>=1.24"]
dev = ["pytest>=8.0", "httpx>=0.27"]
eval = [
    "gradio>=6.29.0",
    "pandas>=3.0.6",
]

[project.scripts]
info-retriever = "info_retriever.web:main"

#[[tool.uv.index]]
#url = "https://pypi.apple.com/simple/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_retriever"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
